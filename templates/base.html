<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Aset - Dashboard</title>
    <!-- Menggunakan Bootstrap untuk styling cepat mirip Velzon -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f3f3f9; } /* Warna background terang mirip tema Velzon */
        .navbar { background-color: #ffffff; box-shadow: 0 2px 4px rgba(0,0,0,.08); }
        .sidebar { background-color: #ffffff; min-height: 100vh; padding-top: 20px; box-shadow: 2px 0 5px rgba(0,0,0,.05); }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 24px; border-radius: 0.25rem;}
        .card-title { color: #878a99; font-size: 13px; font-weight: 600; text-transform: uppercase;}
    </style>
</head>
<body>

<!-- Navbar Atas -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">ASSET MANAGEMENT</a>
        <div class="d-flex">
            <!-- Profil User (Dummy) seperti di gambar Velzon -->
            <span class="navbar-text me-3">
                <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Admin" class="rounded-circle" width="32">
                Admin
            </span>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Kiri -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="position-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="/">
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="/api/assets">
                            Data Aset
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="/api/users">
                            Data Pengguna
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Area Konten Utama -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
            <!-- Blok ini akan diganti oleh halaman spesifik (list.html / form.html / index dashboard) -->
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
